<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>ジャンカラ料金比較</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@stlite/browser@0.85.1/build/stlite.css"
    />
    <style>
      /* WASM 起動までのローディング表示 */
      #boot {
        font-family: system-ui, sans-serif;
        text-align: center;
        padding: 4rem 1rem;
        color: #555;
      }
      #boot .spin {
        width: 28px;
        height: 28px;
        margin: 0 auto 12px;
        border: 3px solid #ddd;
        border-top-color: #ff4b4b;
        border-radius: 50%;
        animation: s 0.9s linear infinite;
      }
      @keyframes s {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot">
        <div class="spin"></div>
        アプリを起動しています（初回は読み込みに時間がかかります）…
      </div>
    </div>
    <script type="module">
      import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@0.85.1/build/stlite.js";

      // app.py とデータJSONをURLからマウント（既存コードを書き換えず流用）
      mount(
        {
          requirements: ["pandas"],
          entrypoint: "app.py",
          files: {
            "app.py": { url: "./app.py" },
            "data/shops_data.json": { url: "./data/shops_data.json" },
          },
        },
        document.getElementById("root"),
      );
    </script>
  </body>
</html>
