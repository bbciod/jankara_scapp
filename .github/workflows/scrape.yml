name: 週次 料金データ自動更新

on:
  schedule:
    # 毎時0分は GitHub のスケジュール実行が混み起動が遅れやすいため、分をずらす
    - cron: "37 17 * * 0"  # 毎週月曜 AM2:37 JST（= 日曜 17:37 UTC）
  workflow_dispatch:
    inputs:
      shop_ids:
        description: "特定店舗IDのみ取得（スペース区切り、空欄=全店舗）"
        required: false
        default: ""

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 180   # 全200店舗 × (4秒待機 + ページ読込) ≒ 最大90分。念のため3時間

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          # requirements.txt を廃止したため、pipキャッシュのキーはスクレイパー依存を指す。
          # 指定しないと既定で requirements.txt/pyproject.toml を探し、見つからず失敗する。
          cache-dependency-path: requirements_scraper.txt

      - name: Install Python dependencies
        run: pip install -r requirements_scraper.txt

      # Playwright: Chromiumブラウザ本体とOSレベルの依存ライブラリをインストール
      - name: Install Playwright Chromium
        run: playwright install chromium --with-deps

      - name: Run scraper
        # 入力を ${{ }} でスクリプトに直接埋め込むと、"; 任意コマンド" のような値で
        # シェルインジェクションが起きる。環境変数で渡し、数字とスペースだけを許可する。
        env:
          SHOP_IDS: ${{ github.event.inputs.shop_ids }}
        run: |
          if [ -n "$SHOP_IDS" ]; then
            if ! printf '%s' "$SHOP_IDS" | grep -Eq '^ *[0-9]{3,}( +[0-9]{3,})* *$'; then
              echo "::error::shop_ids は3桁以上の店舗IDをスペース区切りで指定してください"
              exit 1
            fi
            python scraper.py --shop-ids $SHOP_IDS
          else
            python scraper.py
          fi

      - name: Commit & push updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/shops_data.json
          if git diff --cached --quiet; then
            echo "データに変更なし。コミットをスキップします。"
          else
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
            git commit -m "chore(data): 料金データ自動更新 ${TIMESTAMP}"
            git push
          fi
